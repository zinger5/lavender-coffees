<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Pricing</title>
</head>
<body>
    <h1>Coffee Strength Pricing</h1>
    <form>
        <label for="strength">Select your coffee strength:</label><br>
        <input type="radio" id="single" name="strength" value="0.05">
        <label for="single">Single ($0.05)</label><br>
        <input type="radio" id="double" name="strength" value="0.10">
        <label for="double">Double ($0.10)</label><br><br>
        <label for="email">Enter your email:</label><br>
        <input type="email" id="email" name="email" required>
        <br><br>
        <input type="submit" value="Order Now">
    </form>
</body>
</html>
