<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lavender Coffees</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

<style>
:root {
  --lavender-dark:#7e4a66;
}

* { box-sizing:border-box; }

body {
  font-family:'Quicksand',sans-serif;
  background:url('https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=1500&q=80') no-repeat center center fixed;
  background-size:cover;
  padding:40px;
  max-width:750px;
  margin:auto;
}

form {
  background:rgba(255,255,255,0.95);
  padding:25px;
  border-radius:12px;
}

h1,h2 {
  text-align:center;
  color:var(--lavender-dark);
}

label {
  display:block;
  margin-top:10px;
  font-weight:600;
}

select,input,button {
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ccc;
}

button {
  background:var(--lavender-dark);
  color:white;
  border:none;
  cursor:pointer;
}

#cart div {
  background:white;
  padding:10px;
  border-radius:8px;
  margin-bottom:8px;
}

#price {
  font-size:2rem;
  font-weight:bold;
  text-align:center;
  margin:15px 0;
  padding:12px;
  border-radius:10px;
  background:#f5e9f7;
  color:var(--lavender-dark);
}

.section-title {
  margin-top:20px;
  font-weight:700;
  color:var(--lavender-dark);
}
</style>
</head>

<body>

<h1>☕ Lavender Coffees ☕</h1>

<form id="form"
action="https://formsubmit.co/cmurphy@lavender.enfield.sch.uk"
method="POST">

<!-- FORM SUBMIT SETTINGS -->
<input type="hidden" name="_subject" value="New Coffee Order ☕">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_template" value="table">

<!-- ORDER DATA SENT -->
<input type="hidden" name="order_summary" id="order_summary">

<!-- ☕ COFFEE -->
<label>Coffee ☕</label>
<select name="coffee" required>
  <option value="">Select</option>
  <option value="latte">Latte ☕</option>
  <option value="cappuccino">Cappuccino 🥛</option>
  <option value="americano">Americano ☕</option>
  <option value="mocha">Mocha 🍫</option>
  <option value="espresso">Espresso ⚡</option>
  <option value="flatwhite">Flat White 🤍</option>
  <option value="macchiato">Macchiato 🎯</option>
  <option value="coldbrew_plain">Cold Brew (No Foam) 🧊</option>
  <option value="coldbrew_foam">Cold Brew (Foam) ☁️</option>
</select>

<!-- 📅 DATE -->
<label class="section-title">📅 Order Date</label>
<input type="date" name="date" required>

<!-- ☕ STRENGTH -->
<label>Strength</label>
<select name="strength" required>
  <option value="">Select</option>
  <option value="single">Single 1️⃣</option>
  <option value="double">Double 2️⃣</option>
</select>

<!-- 🌡️ TEMPERATURE -->
<label class="section-title">🌡️ Temperature</label>
<select name="temp" required>
  <option value="">Select</option>
  <option value="hot">Hot 🔥</option>
  <option value="iced">Iced ❄️</option>
</select>

<!-- 📍 LOCATION -->
<label class="section-title">📍 Location</label>
<input name="location" placeholder="Enter location" required>

<!-- 👤 INFO -->
<label>Name</label>
<input name="name" required>

<label>Email</label>
<input name="email" type="email" required>

<!-- 💰 PRICE -->
<div id="price">£0.00</div>

<div class="actions">
  <button type="button" id="add">Add ➕</button>
  <button type="button" id="clear">Clear 🗑️</button>
</div>

<button type="submit">Place Order ☕</button>

</form>

<h2>🛒 Cart</h2>
<div id="cart">Empty 🛒</div>

<script>
const prices = {
  coffee:{
    latte:0.65,
    cappuccino:0.70,
    americano:0.45,
    mocha:0.85,
    espresso:0.40,
    flatwhite:0.75,
    macchiato:0.45,
    coldbrew_plain:0.50,
    coldbrew_foam:0.80
  },
  strength:{ single:0, double:0.05 },
  temp:{ hot:0, iced:0.10 }
};

const names = {
  latte:"Latte ☕",
  cappuccino:"Cappuccino 🥛",
  americano:"Americano ☕",
  mocha:"Mocha 🍫",
  espresso:"Espresso ⚡",
  flatwhite:"Flat White 🤍",
  macchiato:"Macchiato 🎯",
  coldbrew_plain:"Cold Brew (No Foam) 🧊",
  coldbrew_foam:"Cold Brew (Foam) ☁️"
};

const form = document.getElementById("form");
const cartDiv = document.getElementById("cart");
const priceDiv = document.getElementById("price");

let cart = [];

function getData(){
  const d = new FormData(form);

  const total =
    (prices.coffee[d.get("coffee")] || 0) +
    (prices.strength[d.get("strength")] || 0) +
    (prices.temp[d.get("temp")] || 0);

  return {
    coffee: d.get("coffee"),
    strength: d.get("strength"),
    temp: d.get("temp"),
    date: d.get("date"),
    location: d.get("location"),
    name: d.get("name"),
    email: d.get("email"),
    total: total.toFixed(2)
  };
}

// LIVE PRICE
form.addEventListener("input", () => {
  const d = getData();
  priceDiv.textContent = `£${d.total}`;
});

// ADD
document.getElementById("add").onclick = () => {
  cart.push(getData());
  render();
};

// CLEAR
document.getElementById("clear").onclick = () => {
  cart = [];
  render();
};

// RENDER CART
function render(){
  if(cart.length === 0){
    cartDiv.innerHTML = "Empty 🛒";
    return;
  }

  cartDiv.innerHTML = cart.map((i, idx) => `
    <div>
      ☕ ${names[i.coffee]} | 📅 ${i.date} | 📍 ${i.location} - £${i.total}
      <button onclick="removeItem(${idx})">❌</button>
    </div>
  `).join("");
}

function removeItem(i){
  cart.splice(i, 1);
  render();
}

// SUBMIT → SEND EMAIL
form.addEventListener("submit", (e) => {
  e.preventDefault();

  if(cart.length === 0) cart.push(getData());

  const summary = cart.map(i =>
    `Coffee: ${names[i.coffee]} | Date: ${i.date} | Location: ${i.location} | Total: £${i.total}`
  ).join("\n");

  document.getElementById("order_summary").value = summary;

  form.submit(); // sends to FormSubmit
});

render();
</script>

</body>
</html>
