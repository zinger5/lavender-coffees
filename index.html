<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lavender Coffees</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: url('https://images.unsplash.com/photo-1509042239860-f550ce710b93?ixlib=rb-4.0.3&auto=format&fit=crop&w=1500&q=80')
        no-repeat center center fixed;
      background-size: cover;
      color: #4b2e39;
      padding: 40px;
      max-width: 600px;
      margin: auto;
      text-shadow: 0 0 3px rgba(255, 255, 255, 0.8);
    }
    form {
      background-color: rgba(255, 255, 255, 0.93);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }
    h1 {
      text-align: center;
      color: #7e4a66;
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 1px 1px 2px #fff;
    }
    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
      color: #5d3b4a;
    }
    select,
    input[type=text],
    input[type=submit] {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1em;
      box-sizing: border-box;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      cursor: pointer;
    }
    input[type=radio],
    input[type=checkbox] {
      margin-right: 8px;
      transform: scale(1.1);
      cursor: pointer;
    }
    input[type=submit] {
      background-color: #7e4a66;
      color: white;
      border: none;
      cursor: pointer;
    }
    input[type=submit]:hover {
      background-color: #9b5c81;
    }
    #order-summary {
      background: rgba(246, 236, 244, 0.95);
      border-radius: 12px;
      margin-top: 30px;
      padding: 20px;
      text-align: left;
      color: #453038;
      font-size: 1.1em;
      box-shadow: 0 4px 10px rgba(206, 174, 197, 0.2);
    }
  </style>
</head>
<body>
  <h1>Lavender Coffees</h1>
  <form id="coffee-form">
    <label for="coffee">Type of Coffee</label>
    <select id="coffee" name="coffee" required>
      <option value="">--Select--</option>
      <option value="Latte">Latte</option>
      <option value="Cappuccino">Cappuccino</option>
      <option value="Americano">Americano</option>
      <option value="Espresso Shot">Espresso Shot</option>
      <option value="Flat White">Flat White</option>
      <option value="Macchiato">Macchiato</option>
      <option value="Cortado">Cortado</option>
      <option value="Classic Mocha With Chocolate Froth">Classic Mocha With Chocolate Froth</option>
      <option value="Cold Brew (No Foam)">Cold Brew(No foam)</option>
      <option value="Cold Brew (Foam)">Cold Brew(foam)</option>
    </select>

    <label for="strength">Strength</label>
    <select id="strength" name="strength" required>
      <option value="">--Select--</option>
      <option value="Single">Single</option>
      <option value="Double">Double</option>
    </select>

    </div>


    <label for="customer">Your Name</label>
    <input type="text" id="customer" name="customer" placeholder="Name for order" required />

    <label for="customer">Location</label>
    <input type="text" id="customer" name="customer" placeholder="Pickup location" required />

    <label for="customer">Day</label>
    <input type="text" id="customer" name="customer" placeholder="Day" required />

    <label for="customer">Email</label>
    <input type="text" id="customer" name="customer" placeholder="Email" required />

   <label for="decafe">Tick for Decaf:</label>
   <input type="checkbox" id="decafe" name="decafe" value="Yes">

    <input type="submit" value="Order" />
  </form>

  <div id="order-summary"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // ------------ PRICE LIST -------------
      const prices = {
        coffee: {
          "Latte": 0.65,
          "Cappuccino": 0.70,
          "Americano": 0.45,
          "Flat White": 0.65,
          "Macchiato": 0.75,
          "Cortado": 0.60,
          "Classic Mocha With Chocolate Froth": 0.80,
          "Cold Brew(No Foam)": 0.50,
          "Cold Brew(Foam)": 0.70
        },
        strength: {
          "Single": 0.5,
          "Double": 0.10
        },
        },
        }
      };

      const form = document.getElementById("coffee-form");
      const summary = document.getElementById("order-summary");

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const coffeeType = form.coffee.value;
        const strength = form.strength.value;
        const size = form.size.value;
        const customer = form.customer.value.trim();

        // Gather froth options
        let frothTotal = 0;
        let selectedFroths = [];
        Array.from(form.querySelectorAll("input[type=checkbox][name='froth']")).forEach(cb => {
          if (cb.checked) {
            frothTotal += prices.froth[cb.value] || 0;
            selectedFroths.push(cb.value);
          }
        });

        // Calculate price
        let basePrice = (prices.coffee[coffeeType] || 0)
            + (prices.strength[strength] || 0)
            + frothTotal
            + (prices.size[size] || 0);

        // To 2 decimal places
        basePrice = Math.round(basePrice * 100) / 100;

        // Build summary
        let html = `<h2>Order Summary</h2>`;
        html += `<p><strong>Name:</strong> ${customer}</p>`;
        html += `<p><strong>Coffee:</strong> ${coffeeType}</p>`;
        html += `<p><strong>Strength:</strong> ${strength}</p>`;
        html += `<p><strong>Size:</strong> ${size}</p>;
        html += `<p><strong>Total Price:</strong> <span style="color: #7e4a66;">$${basePrice.toFixed(2)}</span></p>`;
        summary.innerHTML = html;
      });
    });
  </script>
</body>
</html>
